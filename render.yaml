services:
  - type: web
    name: lifetrade-online
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifetrade-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
databases:
  - name: lifetrade-db
    plan: basic-256mb
