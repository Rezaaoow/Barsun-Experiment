<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><title>آزمایش آنلاین لایف‌ترید</title>
<style>
:root{
  color-scheme:light;
  --ink:#171717;
  --muted:#626262;
  --line:#dedede;
  --soft:#f5f5f5;
  --soft-2:#ededed;
  --card:#fff;
  --radius:22px;
  font-family:"Vazirmatn",Tahoma,"Segoe UI",Arial,sans-serif;
  font-synthesis:none;
  text-rendering:optimizeLegibility;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--soft);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",Arial,sans-serif}
body{min-height:100svh;display:flex;align-items:stretch;justify-content:center}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.screen{position:relative;width:100%;height:100svh;min-height:0;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,30px);overflow:hidden}
.screen.trial-screen{padding:clamp(8px,2vw,24px);overflow:hidden}
.hidden{display:none!important}
.panel{width:min(680px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:clamp(22px,4vw,44px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:24px;line-height:1.9;box-shadow:0 14px 42px rgba(0,0,0,.055);text-align:right}
.panel h1{font-size:clamp(1.35rem,3vw,1.85rem);font-weight:750;line-height:1.55;margin:0 0 16px;letter-spacing:-.025em}
.panel p{color:#333;margin:0 0 15px;font-size:clamp(.98rem,2vw,1.1rem);line-height:1.95}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:.95rem;color:#222}
.field input,.field select{width:100%;padding:11px 12px;background:#fff;border:1px solid #aaa;border-radius:10px;color:#000;font-size:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--ink);border-radius:12px;padding:12px 24px;font-size:1rem;font-weight:650;background:var(--ink);color:#fff;cursor:pointer;font-family:inherit;transition:transform .12s ease,background .12s ease,opacity .12s ease;touch-action:manipulation}
.btn:hover{background:#303030}
.btn:active{transform:scale(.99)}
.btn:focus-visible{outline:3px solid #8b8b8b;outline-offset:3px}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:.9rem!important;color:var(--muted)!important;margin-top:14px!important}
.status{position:fixed;left:10px;bottom:max(8px,env(safe-area-inset-bottom));z-index:20;max-width:min(42vw,360px);font-size:11px;color:#505050;user-select:none;direction:rtl;background:rgba(255,255,255,.94);border:1px solid #e7e7e7;padding:5px 9px;border-radius:9px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.finish-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#stimulus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,28px);overflow:hidden}
.instruction-screen,.interstitial-screen{width:min(760px,100%);height:min(680px,calc(100dvh - 36px));max-height:100%;min-height:0;padding:clamp(20px,3.5vw,36px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 42px rgba(0,0,0,.055);text-align:right;line-height:1.85;display:flex;flex-direction:column;align-items:stretch;overflow:hidden}
.instruction-progress{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(14px,2.5vh,22px);color:var(--muted);font-size:.82rem}
.instruction-progress .step-count{color:var(--ink);font-weight:650;white-space:nowrap}
.progress-track{width:100%;height:4px;background:#ececec;border-radius:99px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--ink);border-radius:99px;transition:width .18s ease}
.instruction-heading{font-size:clamp(1.35rem,3.2vw,1.9rem);font-weight:750;letter-spacing:-.025em;line-height:1.55;margin:0 0 clamp(12px,2vh,20px);flex:none}
.instruction-content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2vh,18px);overflow:hidden}
.instruction-content p{font-size:clamp(.98rem,2vw,1.12rem);margin:0;line-height:1.9;color:#303030}
.instruction-content .hintline{font-size:.92rem;color:var(--muted);line-height:1.8}
.continue-note{color:var(--muted);font-size:.9rem;margin-top:12px}
.trial-layout{width:100%;max-width:1240px;min-height:min(78vh,780px);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(8px,2vw,26px);align-items:stretch;direction:ltr}
.choice-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,28px);width:100%;min-width:0;min-height:clamp(260px,58vh,560px);padding:clamp(16px,3vw,38px);border:1.5px solid #d3d3d3;border-radius:20px;background:#fff;color:#111;font-family:inherit;cursor:pointer;touch-action:manipulation;transition:border-color .1s,background .1s,box-shadow .1s}
.choice-card:hover{border-color:#777;box-shadow:0 5px 18px rgba(0,0,0,.045)}
.choice-card:focus-visible{outline:4px solid #777;outline-offset:3px}
.choice-card:active{background:#f4f4f4}
.choice-label{font-size:clamp(.95rem,1.7vw,1.1rem);color:#555;direction:rtl}
.choice-amount{font-size:clamp(1.5rem,4.4vw,3.5rem);font-weight:750;line-height:1.5;text-align:center;direction:rtl;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.choice-detail{font-size:clamp(1rem,2.4vw,1.5rem);line-height:1.8;text-align:center;direction:rtl;max-width:25ch}
.or-divider{align-self:center;display:flex;align-items:center;justify-content:center;width:clamp(34px,5vw,64px);height:clamp(34px,5vw,64px);border-radius:50%;background:#ededed;font-size:clamp(.8rem,1.5vw,1rem);font-weight:750;color:#333}
.trial-instruction{position:absolute;top:clamp(8px,2vh,20px);left:50%;transform:translateX(-50%);width:max-content;max-width:95%;text-align:center;font-size:clamp(.85rem,1.8vw,1rem);color:#555;direction:rtl}
.fixation{font-size:clamp(2rem,5vw,4rem);font-weight:400;line-height:1}
.page-actions{display:flex;justify-content:stretch;gap:10px;margin-top:auto;padding-top:clamp(16px,3vh,28px);flex:none}
.next-page{width:100%;min-width:150px}
.example-box{border:1.5px solid #dedede;padding:clamp(12px,2.2vw,22px);margin:0 auto;width:100%;max-width:620px;text-align:center;background:#fafafa;color:#111;border-radius:16px}
.example-title{font-size:clamp(.95rem,1.8vw,1.1rem);font-weight:650;margin-bottom:clamp(10px,2vh,18px)}
.example-choices{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;justify-content:center;gap:clamp(8px,2vw,20px)}
.example-choice{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;background:#171717;color:#fff;border-radius:13px;padding:clamp(10px,2vw,16px) 10px;min-width:0;min-height:76px;font-size:clamp(.85rem,1.5vw,1rem);line-height:1.65}
.example-choice strong{font-weight:750}
.example-or{align-self:center;font-size:1rem;color:#555;font-weight:650}
.example-callout{background:#f1f1f1;color:#181818;border-right:3px solid #171717;padding:clamp(14px,2.4vw,22px);margin:0 auto;text-align:right;max-width:900px;width:100%;line-height:1.9;border-radius:12px;font-size:clamp(.98rem,1.9vw,1.1rem)}
.device-note{border-right:3px solid #a7a7a7;padding-right:12px;text-align:right;color:#444}
@media(max-width:640px){
  .screen{padding:12px}
  .screen.trial-screen{padding:10px 8px max(28px,env(safe-area-inset-bottom))}
  .panel{width:100%;max-height:calc(100dvh - 24px);padding:22px 18px;border-radius:20px}
  .panel h1{font-size:1.4rem;margin-bottom:12px}
  .panel p{font-size:.98rem;line-height:1.85;margin-bottom:12px}
  #stimulus{padding:10px}
  .instruction-screen,.interstitial-screen{height:calc(100dvh - 20px);padding:18px 16px 15px;border-radius:18px}
  .instruction-progress{font-size:.76rem;margin-bottom:12px}
  .instruction-heading{font-size:clamp(1.18rem,5vw,1.5rem);line-height:1.55;margin-bottom:10px}
  .instruction-content{gap:12px}
  .instruction-content p{font-size:.96rem;line-height:1.82}
  .instruction-content .hintline{font-size:.87rem}
  .page-actions{padding-top:14px}
  .next-page{min-height:48px}
  .example-box{padding:12px 10px;border-radius:13px}
  .example-title{font-size:.94rem;margin-bottom:10px}
  .example-choices{gap:7px}
  .example-choice{padding:10px 5px;min-height:68px;font-size:.82rem;border-radius:10px}
  .example-callout{padding:12px 13px;font-size:.93rem;line-height:1.8}
  .device-note{padding-right:10px}
  .trial-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr auto;gap:8px;min-height:72vh}
  .or-divider{grid-column:1 / -1;grid-row:2;width:42px;height:42px;justify-self:center}
  .choice-card{min-height:54vh;padding:12px 8px;gap:14px;border-radius:13px}
  .choice-amount{font-size:clamp(1.1rem,5vw,1.8rem)}
  .choice-detail{font-size:clamp(.9rem,3.4vw,1.15rem)}
  .choice-label{font-size:.84rem}
  .trial-instruction{top:6px;font-size:.82rem}
  .status{left:7px;bottom:max(5px,env(safe-area-inset-bottom));font-size:10px;padding:4px 7px;max-width:46vw}
}
@media(max-height:700px){
  .instruction-screen,.interstitial-screen{height:calc(100dvh - 20px);padding-top:16px;padding-bottom:14px}
  .instruction-progress{margin-bottom:10px}
  .instruction-heading{font-size:clamp(1.12rem,2.8vh,1.5rem);margin-bottom:8px}
  .instruction-content{gap:10px}
  .instruction-content p{font-size:clamp(.9rem,1.9vh,1rem);line-height:1.72}
  .example-box{padding:10px;margin:0 auto}
  .example-title{margin-bottom:8px}
  .example-choice{min-height:60px;padding:8px}
  .example-callout{padding:10px 12px}
  .page-actions{padding-top:10px}
}
@media(max-width:360px){
  .instruction-screen,.interstitial-screen{padding-right:13px;padding-left:13px}
  .example-choice{font-size:.78rem}
}
@media(max-height:520px) and (min-width:641px){
  .trial-layout{min-height:78vh}
  .choice-card{min-height:70vh;gap:8px;padding:12px}
  .choice-amount{font-size:clamp(1.2rem,4vh,2.2rem)}
  .choice-detail{font-size:clamp(.9rem,2.8vh,1.2rem)}
}

/* Refinements requested after mobile review */
.interstitial-screen,.instruction-screen{ text-align:center; }
.instruction-heading{ text-align:center; width:100%; }
.instruction-content{ align-items:center; text-align:center; gap:clamp(10px,1.8vh,16px); }
.instruction-content p{ text-align:center; font-size:clamp(1.06rem,2.1vw,1.2rem); font-weight:650; line-height:1.82; color:#222; }
.instruction-content .hintline{font-weight:500;font-size:1rem;}
.interstitial-screen.title-only .instruction-heading{
  flex:1; display:flex; align-items:center; justify-content:center;
  margin:0; text-align:center; line-height:1.65;
}
.interstitial-screen.title-only .instruction-content{display:none;}
.interstitial-screen .instruction-progress{width:100%;text-align:right;}
.instruction-explanation{
  width:100%; margin:0; padding:0 2px; font-weight:700!important;
  font-size:clamp(1.08rem,2.2vw,1.22rem)!important; color:#171717!important;
  line-height:1.85!important; text-align:center!important;
}
.example-note{
  margin:9px 0 0!important; color:#666!important; font-size:.82rem!important;
  font-weight:500!important; line-height:1.65!important; text-align:center!important;
}
.choice-label{display:none!important;}
.status{display:none!important;}
.choice-card{
  position:relative; transform:translateZ(0);
  transition:transform .09s ease-out,background .09s ease-out,border-color .09s ease-out,box-shadow .09s ease-out;
  user-select:none;-webkit-user-select:none;
}
.choice-card:active,.choice-card.is-pressed{
  transform:scale(.975); background:#e9e9e9; border-color:#171717;
  box-shadow:inset 0 0 0 2px #171717,0 3px 10px rgba(0,0,0,.10);
}
@media(max-width:640px){
  .interstitial-screen,.instruction-screen{ text-align:center; }
  .instruction-content{gap:10px;}
  .instruction-content p{font-size:1.04rem;font-weight:650;line-height:1.72;}
  .instruction-explanation{font-size:1.07rem!important;line-height:1.7!important;}
  .example-note{font-size:.78rem!important;line-height:1.55!important;margin-top:7px!important;}
  .example-box{padding:10px 9px;}
  .example-title{margin-bottom:8px;}
  .example-choice{min-height:58px;padding:8px 4px;}
  .trial-layout{min-height:0;height:auto;align-content:center;grid-template-rows:auto auto;}
  .choice-card{min-height:clamp(180px,30svh,240px);height:auto;padding:10px 6px;gap:10px;}
  .choice-amount{font-size:clamp(1.06rem,4.8vw,1.65rem);line-height:1.45;}
  .choice-detail{font-size:clamp(.85rem,3.3vw,1.05rem);line-height:1.65;}
}
@media(max-height:620px){
  .interstitial-screen{height:calc(100dvh - 16px);padding-top:10px;padding-bottom:10px;}
  .instruction-progress{margin-bottom:8px;}
  .instruction-heading{font-size:clamp(1.1rem,2.8vh,1.45rem);margin-bottom:6px;}
  .instruction-content{gap:8px;}
  .instruction-content p{font-size:clamp(.92rem,1.9vh,1rem);line-height:1.65;}
  .instruction-explanation{font-size:clamp(.95rem,2vh,1.08rem)!important;line-height:1.6!important;}
  .page-actions{padding-top:8px;}
  .next-page{min-height:44px;padding:9px 18px;}
}


/* Final welcome and choice interaction refinements */
#welcome,#finish{text-align:center;}
#welcome h1,#finish h1{
  width:100%;
  text-align:center;
  font-size:clamp(1.65rem,4vw,2.15rem);
  font-weight:800;
  line-height:1.55;
}
#welcome p,#finish p{
  width:100%;
  max-width:58ch;
  text-align:center;
  font-size:clamp(1.08rem,2.3vw,1.22rem);
  font-weight:650;
  line-height:1.9;
}
#welcome p.hint,#finish p.hint{
  font-size:clamp(1.08rem,2.3vw,1.22rem)!important;
  color:#303030!important;
  font-weight:650!important;
}
#welcome #start,#finish #close{margin:8px auto 0;}
#finish .finish-actions{width:100%;justify-content:center;text-align:center;}
#finish #participant-code{margin-left:auto;margin-right:auto;text-align:center;}
.choice-question{
  display:block;
  width:100%;
  text-align:center;
  font-size:clamp(.91rem,1.5vw,1.02rem);
  line-height:1.55;
  font-weight:750;
  color:#303030;
  direction:rtl;
}
.or-divider{font-size:clamp(1.12rem,2.4vw,1.42rem);font-weight:900;}
.choice-card{
  transform:none!important;
  transition:background-color .10s ease,border-color .10s ease,box-shadow .10s ease;
  -webkit-user-select:none;
  user-select:none;
}
.choice-card:active,.choice-card.is-pressed{
  transform:none!important;
  background:#e5e5e5;
  border-color:#171717;
  box-shadow:inset 0 0 0 2px #171717,0 2px 8px rgba(0,0,0,.08);
}
.choice-card:disabled{cursor:default;opacity:1;}
.choice-card:disabled:not(.is-pressed){
  background:#fafafa;
  border-color:#e5e5e5;
  box-shadow:none;
  color:#555;
}
@media(max-width:640px){
  #welcome,#finish{padding:24px 18px;}
  #welcome h1,#finish h1{font-size:1.6rem;margin-bottom:14px;}
  #welcome p,#finish p{font-size:1.04rem;font-weight:650;line-height:1.85;}
  #welcome p.hint,#finish p.hint{font-size:1.04rem!important;font-weight:650!important;}
  #welcome #start,#finish #close{width:100%;max-width:320px;}
  .choice-question{font-size:clamp(.82rem,3.25vw,.96rem);font-weight:750;line-height:1.5;}
  .or-divider{font-size:1.32rem;font-weight:900;}
  .choice-card:active,.choice-card.is-pressed{
    transform:none!important;
    box-shadow:inset 0 0 0 2px #171717;
  }
}


/* Trial choice screen: a single centered prompt above compact option cards */
.trial-stage{
  width:100%;height:100%;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,3.5vh,32px);
  padding:clamp(24px,6vh,54px) clamp(12px,2.5vw,28px) clamp(16px,3vh,26px);
}
.trial-question{
  width:100%;flex:none;margin:0;
  text-align:center;direction:rtl;
  font-size:clamp(1.6rem,3.4vw,2.25rem);
  font-weight:800;line-height:1.5;letter-spacing:-.02em;color:#171717;
}
.trial-layout{
  width:100%;max-width:1160px;min-height:0;height:min(55vh,520px);
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:clamp(10px,1.8vw,22px);align-items:stretch;
}
.trial-layout .choice-card{
  min-height:0;height:100%;
  padding:clamp(12px,2vw,24px);
  gap:clamp(10px,2vh,18px);
}
@media(max-width:640px){
  .trial-stage{
    gap:clamp(10px,2.5vh,18px);
    padding:clamp(22px,4.5vh,38px) 8px max(12px,env(safe-area-inset-bottom));
  }
  .trial-question{font-size:clamp(1.3rem,5.2vw,1.7rem);line-height:1.5;}
  .trial-layout{
    width:100%;max-width:100%;height:auto;min-height:0;flex:none;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto auto;gap:8px;
  }
  .trial-layout .choice-card{
    height:clamp(170px,30svh,230px);min-height:0;
    padding:9px 6px;gap:clamp(8px,1.5vh,12px);
  }
  .trial-layout .choice-amount{font-size:clamp(1.05rem,4.8vw,1.6rem);line-height:1.4;}
  .trial-layout .choice-detail{font-size:clamp(.84rem,3.3vw,1rem);line-height:1.58;}
  .trial-layout .or-divider{grid-column:1 / -1;grid-row:2;width:40px;height:40px;}
}
@media(max-height:600px) and (min-width:641px){
  .trial-stage{gap:12px;padding:12px 16px;}
  .trial-question{font-size:clamp(1.15rem,4vh,1.8rem);}
  .trial-layout{height:62vh;}
  .trial-layout .choice-card{gap:8px;padding:10px;}
}


/* Participant enters an existing study code; never generate one in the browser. */
#welcome .participant-code-field{width:100%;max-width:420px;margin:12px auto 16px;text-align:right;}
#welcome .participant-code-field label{font-size:.98rem;font-weight:700;color:#222;}
#welcome .participant-code-field input{text-align:center;direction:ltr;font-weight:650;letter-spacing:.04em;min-height:48px;}
#welcome #participant-code-error{margin:6px 0 0!important;color:#9b1c1c!important;font-size:.9rem!important;text-align:center;}

/* Stage 2: keep the example, choices and explanatory text fully visible without scrolling. */
.instruction-example-page .instruction-content{gap:clamp(6px,1.1vh,10px);}
.instruction-example-page .instruction-content>p:not(.instruction-explanation){font-size:clamp(.92rem,1.7vw,1.02rem);line-height:1.55;font-weight:550;}
.instruction-example-page .instruction-explanation{font-size:clamp(.94rem,1.7vw,1.06rem)!important;line-height:1.55!important;font-weight:600!important;}
.instruction-example-page .example-box{padding:clamp(8px,1.4vw,14px);}
.instruction-example-page .example-title{margin-bottom:clamp(5px,1vh,9px);}
.instruction-example-page .example-choice{min-height:54px;padding:7px 6px;gap:3px;font-size:clamp(.78rem,1.35vw,.9rem);line-height:1.45;}
.instruction-example-page .example-note{margin-top:4px!important;font-size:.72rem!important;line-height:1.4!important;}
@media(max-width:640px){
  .instruction-example-page{padding:12px 12px 10px;height:calc(100dvh - 12px);}
  .instruction-example-page .instruction-progress{font-size:.7rem;margin-bottom:6px;}
  .instruction-example-page .instruction-heading{font-size:1.12rem;line-height:1.35;margin-bottom:5px;}
  .instruction-example-page .instruction-content{gap:7px;}
  .instruction-example-page .instruction-content>p:not(.instruction-explanation){font-size:.88rem;line-height:1.48;font-weight:500;}
  .instruction-example-page .example-box{padding:7px 8px;border-radius:10px;}
  .instruction-example-page .example-title{font-size:.82rem;margin-bottom:6px;}
  .instruction-example-page .example-choices{gap:5px;}
  .instruction-example-page .example-choice{min-height:48px;padding:5px 3px;font-size:.74rem;line-height:1.35;}
  .instruction-example-page .example-choice strong{font-size:.82rem;}
  .instruction-example-page .example-note{font-size:.67rem!important;line-height:1.3!important;margin-top:4px!important;}

 if(!Number.isInteger(maxExclusive)||maxExclusive<1||maxExclusive>0x100000000)throw new RangeError('Invalid random range');
 try{
  const cryptoSource=window.crypto;
  if(cryptoSource&&typeof cryptoSource.getRandomValues==='function'){
   const range=0x100000000;
   const limit=Math.floor(range/maxExclusive)*maxExclusive;
   const value=new Uint32Array(1);
   do{cryptoSource.getRandomValues(value)}while(value[0]>=limit);
   return value[0]%maxExclusive;
  }
 }catch(e){}

}

function showInfo(title, paragraphs=[], note='', progressIndex=null){

  const box=document.createElement('div');
  box.className='interstitial-screen';
  if(progressIndex===1) box.classList.add('instruction-example-page');

    const progress=document.createElement('div');

    const count=document.createElement('div');
    count.className='step-count';
    count.textContent='مرحلهٔ '+(progressIndex+1)+' از '+INSTRUCTION_PAGE_COUNT;
    progress.append(labels,count);
    box.appendChild(progress);
  }

  if(title){
    const h=document.createElement('h2');
    h.className='instruction-heading';
    h.textContent=title;
    box.appendChild(h);
  }

  const content=document.createElement('div');
  content.className='instruction-content';
  paragraphs.forEach(item=>{
    if(typeof item==='string'){
      const p=document.createElement('p');
      p.textContent=item;
      content.appendChild(p);
    }else{
      content.appendChild(item);
    }
  });
  if(note){
    const n=document.createElement('div');
    n.className='continue-note';
    n.textContent=note;
    content.appendChild(n);
  }
  box.appendChild(content);

  const actions=document.createElement('div');
  actions.className='page-actions';
  const next=document.createElement('button');
  next.type='button';
  next.className='btn next-page';
  next.textContent='صفحهٔ بعد';
  actions.appendChild(next);
  box.appendChild(actions);
  next.addEventListener('click',()=>{
    if(typeof window.__pageContinue==='function')window.__pageContinue();
  });
  stimulus.appendChild(box);
  return box;
}

   writePending(readPending().filter(row=>!sentIds.has(row.client_event_id)));
  }
 })();
 try{return await pendingFlushPromise;}
 finally{pendingFlushPromise=null;}
}
async function saveTrial(row){
 const pending=readPending();
 if(!pending.some(item=>item.client_event_id===row.client_event_id)){
  pending.push(row);
  writePending(pending);
 }
 // Queue locally first; trigger network uploads in the background so network latency
 // does not lengthen the measured experiment schedule.
 if(pending.length>=TRIAL_BATCH_SIZE&&pending.length%TRIAL_BATCH_SIZE===0){
  flushPending().catch(()=>{});
 }
 return {saved_locally:readPending().some(item=>item.client_event_id===row.client_event_id)};
}
window.addEventListener('online',()=>{flushPending().catch(()=>{})});window.addEventListener('focus',()=>{flushPending().catch(()=>{})});
async function recoverOrphanedPendingQueues(){
 const prefix='lifetrade_pending_';
 const keys=Object.keys(localStorage).filter(key=>key.startsWith(prefix)&&key!==pendingStorageKey());
 for(const key of keys){
  const oldSessionId=key.slice(prefix.length);
  if(!oldSessionId||oldSessionId==='null')continue;
  let pending;
  try{pending=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){continue}
  if(!Array.isArray(pending)){continue}
  if(!pending.length){localStorage.removeItem(key);continue}
  if(pending.some(row=>!row||typeof row.client_event_id!=='string'||(row.session_id&&row.session_id!==oldSessionId))){
   throw new Error('PENDING_RECOVERY_INVALID');
  }
  while(pending.length){
   const batch=pending.slice(0,TRIAL_BATCH_MAX);
   await api('/api/trials',{
    session_id:oldSessionId,
    trials:batch.map(row=>({client_event_id:row.client_event_id,row}))
   });
   const sentIds=new Set(batch.map(row=>row.client_event_id));
   let latest;
   try{latest=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){latest=pending}
   if(!Array.isArray(latest))latest=pending;
   const remaining=latest.filter(row=>!sentIds.has(row.client_event_id));
   if(remaining.length)localStorage.setItem(key,JSON.stringify(remaining));
   else localStorage.removeItem(key);
   pending=remaining;
  }
 }
}

function makeTrialScreen(taskKey,magnitude,trialData,nowLeft){
 $('screen').classList.add('trial-screen');stimulus.innerHTML='';
 const layout=document.createElement('div');layout.className='trial-layout';layout.setAttribute('role','group');layout.setAttribute('aria-label','دو گزینه برای انتخاب');
 const left=optionText(taskKey,magnitude,trialData,nowLeft),right=optionText(taskKey,magnitude,trialData,!nowLeft);
 function card(info,side){
  const b=document.createElement('button');b.type='button';b.className='choice-card';b.dataset.choiceSide=side;b.setAttribute('aria-label',`کدام گزینه را ترجیح می‌دهید؟ ${side==='left'?'گزینهٔ چپ':'گزینهٔ راست'}: ${info.amount}، ${info.detail}`);

  const label=document.createElement('span');label.className='choice-label';label.textContent=info.label;
  const amount=document.createElement('span');amount.className='choice-amount';amount.textContent=info.amount;
  const detail=document.createElement('span');detail.className='choice-detail';detail.textContent=info.detail;
  b.append(label,amount,detail);b.addEventListener('click',()=>resolveChoice(`tap-${side}`));return b
 }
 const leftCard=card(left,'left'),rightCard=card(right,'right');
 const or=document.createElement('div');or.className='or-divider';or.textContent='یا';or.setAttribute('aria-hidden','true');
 layout.append(leftCard,or,rightCard);
 const stage=document.createElement('div');stage.className='trial-stage';
 const question=document.createElement('h1');question.className='trial-question';question.textContent='کدام گزینه را ترجیح می‌دهید؟';
 stage.append(question,layout);stimulus.appendChild(stage);
}
function resolveChoice(key){
 if(!currentTrialResolve||responseLock)return;
 responseLock=true;
 const selectedSide=key==='escape'?null:(['arrowleft','l','tap-left'].includes(key)?'left':'right');
 document.querySelectorAll('.choice-card').forEach(button=>{
  button.disabled=true;
  button.classList.toggle('is-pressed',button.dataset.choiceSide===selectedSide);
 });
 if(activeKeyHandler){window.removeEventListener('keydown',activeKeyHandler);activeKeyHandler=null}
 if(activeVisibilityHandler){document.removeEventListener('visibilitychange',activeVisibilityHandler);activeVisibilityHandler=null}
 const rt=performance.now()-window.__trialStart;
 const resolve=currentTrialResolve;
 currentTrialResolve=null;
 resolve({key,rt,visibility_hidden:trialWasHidden||document.hidden});
}
function waitForChoice(start){
 window.__trialStart=start;
 responseLock=false;
 trialWasHidden=Boolean(document.hidden);
 activeVisibilityHandler=()=>{if(document.hidden)trialWasHidden=true};
 document.addEventListener('visibilitychange',activeVisibilityHandler);
 return new Promise(resolve=>{
  currentTrialResolve=resolve;
  const handler=e=>{
   const k=e.key.toLowerCase();
   if(['arrowleft','arrowright','l','r'].includes(k)){e.preventDefault();resolveChoice(k)}
   else if(k==='escape'){e.preventDefault();stopped=true;resolveChoice('escape')}
  };
  activeKeyHandler=handler;
  window.addEventListener('keydown',handler);
 });
}
async function runTask(taskKey, taskNum){const task=DATA[taskKey];setStatus(`بخش ${taskNum} از ۲ · راهنما`);for(let page=0;page<INSTRUCTION_PAGE_COUNT;page++){if(stopped)return;showInstructionPage(taskKey,page);await spaceToContinue()}await wait(1500);if(stopped)return;const blocks=shuffle(task.blocks);for(const block of blocks){if(stopped)return;let currentRow=15,stepSize=8;setStatus(`بخش ${taskNum} از ۲ · دور ${block.block_name==='Low'?'کم':block.block_name==='Mid'?'متوسط':'زیاد'}`);for(let trial=1;trial<=5;trial++){if(stopped)return;showFixation();await wait(1000);if(stopped)return;const requestedRow=currentRow;const boundedRow=Math.max(0,Math.min(30,requestedRow));const boundaryHit=requestedRow!==boundedRow;const trialData=task[block.magnitude][boundedRow];if(!trialData){throw new Error(`Missing condition row ${boundedRow} for ${taskKey}/${block.magnitude}`)}const nowLeft=randomInt(2)===1;makeTrialScreen(taskKey,block.magnitude,trialData,nowLeft);const started=performance.now(),startISO=nowISO();const ans=await waitForChoice(started);if(stopped||ans.key==='escape')return;let keySide;if(ans.key==='escape')return;if(['arrowleft','l','tap-left'].includes(ans.key))keySide='left';else keySide='right';const nowSide=nowLeft?'left':'right';const choiceType=keySide===nowSide?'Now':'Later';const leftStimulus=optionLabel(taskKey,block.magnitude,trialData,nowLeft),rightStimulus=optionLabel(taskKey,block.magnitude,trialData,!nowLeft);const rawNextRow=choiceType==='Now'?currentRow-stepSize:currentRow+stepSize;const boundedNextRow=Math.max(0,Math.min(30,rawNextRow));const nextBoundaryHit=rawNextRow!==boundedNextRow;const row={participant_code:participantCode,session_id:sessionId,participant:participantCode,session:sessionId,task:taskKey,task_order:taskNum,block_name:block.block_name,magnitude:block.magnitude,trial_in_block:trial,index:trialData.index,requested_row:requestedRow,displayed_row:boundedRow+1,delay:trialData.delay,choice:trialData.choice,immED50:trialData.immED50,delED50:trialData.delED50,immK:trialData.immK,delK:trialData.delK,left_image:leftStimulus,right_image:rightStimulus,left_stimulus:leftStimulus,right_stimulus:rightStimulus,user_pressed_key:ans.key,user_choice_type:choiceType,response_method:ans.key.startsWith('tap-')?'touch':'keyboard',reaction_time_ms:Number(ans.rt.toFixed(2)),trial_started_iso:startISO,response_iso:nowISO(),boundary_hit:boundaryHit||nextBoundaryHit,requested_next_row:rawNextRow,bounded_next_row:boundedNextRow,client_event_id:crypto.randomUUID(),visibility_hidden:ans.visibility_hidden};rows.push(row);trialCount++;await saveTrial(row);currentRow=boundedNextRow;if(trial<5){stepSize=Math.max(1,Math.floor(stepSize/2))}await wait(1500)}}}
async function startExperiment(){
 const codeInput=$('participant-code-input');
 const codeError=$('participant-code-error');
 const startButton=$('start');
 const enteredCode=codeInput.value.trim();
 if(!enteredCode){
  codeError.textContent='لطفاً کد شرکت‌کننده را وارد کنید.';
  codeError.classList.remove('hidden');
  codeInput.focus();
  return;
 }
 codeError.classList.add('hidden');
 const originalButtonText=startButton.textContent;
 startButton.disabled=true;
 startButton.textContent='در حال آماده‌سازی…';
 stopped=false;
 sessionId=null;
 participantCode=null;
 try{
  try{await recoverOrphanedPendingQueues()}
  catch(error){error.pendingRecovery=true;throw error}
  show();
  const created=await api('/api/session',{
   participant_code:enteredCode,
   experiment_version:'online-mvp-0.4-randomization-visibility-fa',
   user_agent:navigator.userAgent,
   screen_width:screen.width,
   screen_height:screen.height
  });
  sessionId=created.session_id;
  participantCode=created.participant_code;
  participant={participant:participantCode,session:sessionId,date:nowISO()};
  if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen().catch(()=>{});
  // Independently randomize order for each new run. Either order may legitimately repeat.
  const taskOrder=shuffle(['LT','KT']);
  for(let i=0;i<taskOrder.length;i++){
   if(stopped)break;
   await runTask(taskOrder[i],i+1);
   if(stopped)break;
   if(i===0){
    showRest();
    setStatus('استراحت · برای ادامه دکمهٔ ادامه را بزنید');
    await spaceToContinue();
    await wait(1500);
   }
  }
  if(!stopped){
   setStatus('آزمایش تکمیل شد');
   const unsent=await flushPending();
   await api('/api/complete',{session_id:sessionId,status:'completed',trial_count:trialCount});
   const warning=unsent?'تعداد '+unsent+' پاسخ هنوز به سرور نرسیده است. اتصال را بررسی کنید و این صفحه را نبندید.':'';
   showPanel('finish');
   renderParticipantCode(participantCode,warning);
  }else{
   await flushPending();
   await api('/api/complete',{session_id:sessionId,status:'stopped',trial_count:trialCount}).catch(()=>{});
   showPanel('finish');
   $('finish').querySelector('h1').textContent='آزمایش متوقف شد';
   $('finish').querySelector('p').textContent='آزمایش متوقف شد. پاسخ‌هایی که پیش‌تر به سرور رسیده‌اند، ذخیره شده‌اند.';
   renderParticipantCode(participantCode);
  }
 }catch(err){
  console.error(err);
  if(err&&err.pendingRecovery){
   showPanel('welcome');
   codeError.textContent='چند پاسخ از اجرای قبلی هنوز روی این دستگاه ذخیره‌اند و ارسال آن‌ها موفق نشد. اتصال را بررسی کنید و دوباره تلاش کنید؛ داده‌های ذخیره‌شده پاک نشده‌اند.';
   codeError.classList.remove('hidden');
   return;
  }
  if(sessionId){
   await flushPending().catch(()=>{});
   await api('/api/complete',{session_id:sessionId,status:'error',trial_count:trialCount}).catch(()=>{});
  }
  showPanel('finish');
  $('finish').querySelector('h1').textContent='خطا در اتصال یا اجرای آزمایش';
  $('finish').querySelector('p').textContent='سرور نتوانست یکی از عملیات‌ها را کامل کند. اگر کد شرکت‌کننده دارید، پیش از شروع دوباره با تیم پژوهش تماس بگیرید.';
 }finally{
  startButton.disabled=false;
  startButton.textContent=originalButtonText;
 }
}
$('start').addEventListener('click',startExperiment);$('close').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})});
</script></body></html>
