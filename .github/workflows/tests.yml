name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifetrade
          POSTGRES_PASSWORD: lifetrade
          POSTGRES_DB: lifetrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetrade -d lifetrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install disposable test browser
        run: python -m playwright install --with-deps chromium webkit
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.I | re.S)
          assert scripts, "No inline JavaScript found"
          Path("/tmp/lifetrade-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          admin_html = Path("app/admin-links.html").read_text(encoding="utf-8")
          admin_scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", admin_html, flags=re.I | re.S)
          assert admin_scripts, "No admin-link JavaScript found"
          Path("/tmp/admin-links-inline.js").write_text("\n".join(admin_scripts), encoding="utf-8")
          PY
          node --check app/persistence.js
          node --check app/task_timing.js
          node --check /tmp/lifetrade-inline.js
          node --check /tmp/admin-links-inline.js
      - name: Validate staging load-test scripts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("tests/load/create_load_test_users.py").read_text(encoding="utf-8"))
          ast.parse(Path("tests/load/host_diagnostics.py").read_text(encoding="utf-8"))
          PY
          node --input-type=module --check < tests/load/k6_experiment.js
          node --input-type=module --check < ops/k6-ut-dd-resilience.js
          node --input-type=module --check < ops/k6-final-soak.js
          python -m py_compile ops/run-ut-dd-resilience.py ops/deploy-ut-dd-resilience.py ops/release-native.py ops/run-final-soak.py ops/live-final-browser.py ops/sample-stage-resources.py
      - name: Check client outbox failure recovery
        run: node ops/check_client_recovery.mjs
      - name: Run SQLite API regression tests
        run: pytest -q
      - name: Run PostgreSQL integration smoke test
        env:
          DATABASE_URL: postgresql://lifetrade:lifetrade@localhost:5432/lifetrade_test
          ADMIN_TOKEN: ci-admin-token
          DB_POOL_MAX_SIZE: "4"
          BARSAN_SYNC_THREADS: "8"
        run: python tests/postgres_smoke.py
