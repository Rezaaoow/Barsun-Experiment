name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifetrade
          POSTGRES_PASSWORD: lifetrade
          POSTGRES_DB: lifetrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetrade -d lifetrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run SQLite API regression tests
        run: pytest -q
      - name: Run PostgreSQL integration smoke test
        env:
          DATABASE_URL: postgresql://lifetrade:lifetrade@localhost:5432/lifetrade_test
          ADMIN_TOKEN: ci-admin-token
        run: python tests/postgres_smoke.py
